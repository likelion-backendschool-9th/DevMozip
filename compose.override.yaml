services:
  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: [npm, run, dev, --, --hostname, 0.0.0.0]
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
      - gradle_cache:/root/.gradle
    command: [sh, ./gradlew, bootRun, --no-daemon]
  postgres:
    ports: ['127.0.0.1:${DB_PORT:-5432}:5432']
volumes:
  gradle_cache:
