# 서버용 "팀 nginx" 설정 (compose.prod.yaml 의 nginx 서비스)
#
# 인터넷 → 호스트 nginx (호스트 도메인, 443, certbot 인증서)
#        → http://127.0.0.1:3002 (이 nginx, 80)
#        → http://frontend-blue:3000 또는 frontend-green:3000  (활성 색)
#
# HTTPS 는 호스트 nginx 가 끝냈으므로 여기는 80 만 듣는다.
# 호스트 nginx 가 넘겨 준 X-Forwarded-* 헤더를 그대로 frontend 에 전달한다.
#
# upstream 은 nginx/upstream/active.conf 에 따로 있다. 블루그린 스크립트가 그 파일의 서버 줄을
# 바꾸고 nginx -s reload 하는 것으로 트래픽이 넘어간다. 이 파일은 바뀌지 않는다.
# 이 파일이 바뀌면 블루그린 스크립트가 nginx 를 다시 시작한다(파일 하나만 마운트돼 reload 로는 새 내용을 못 읽는다).
include /etc/nginx/upstream/active.conf;

server {
    listen 80;
    server_name _;

    # 메신저 WebSocket. 이 경로만 활성 색의 backend 로 보낸다. 정확히 일치하는 경로라 /api/v1, /actuator 는 노출되지 않는다.
    # 타임아웃은 서버의 ping 주기(30초)·pong 대기(70초)보다 길게 둔다.
    location = /ws/messages {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        proxy_pass http://frontend_upstream;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;
    }
}
