# 로컬 HTTPS. 인증서는 certs/에 mkcert로 발급한다.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 업로드 요청 크기. backend 의 multipart 최대 요청 크기(11MB)와 같게 둔다. 기본값 1MB로는 게시글 이미지 3장을 올릴 수 없다
    client_max_body_size 11m;
    # 업로드 이미지(게시글·프로필·배너). backend 가 프로젝트 폴더의 public/images 에 쓴 파일을 그대로 제공한다 (docs/feed-plan.md 3절)
    location /images/ {
        alias /usr/share/nginx/images/;
        add_header X-Content-Type-Options nosniff;
        expires 1d;
    }
    # 포트폴리오 파일(public/files). 내부 전용 경로라 backend 가 권한을 확인하고 X-Accel-Redirect 로 알려 줄 때만 보낸다.
    # backend 에 FILE_ACCEL_REDIRECT=true 가 있어야 쓰인다 (docs/portfolio-files-api.md)
    location /internal-files/ {
        internal;
        alias /usr/share/nginx/files/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy sandbox;
    }
    # 메신저 WebSocket. 이 경로만 backend 로 보낸다. 브라우저 Origin 이 https://localhost 이므로 backend 의 DOMAINNAME 도 같아야 한다.
    location = /ws/messages {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
