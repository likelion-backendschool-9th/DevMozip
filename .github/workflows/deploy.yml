# CI/CD — push 마다 테스트하고, main 이면 이미지를 만들어 GHCR 에 올리고, 서버에 배포한다.
#
# 저장소 이름이나 팀 번호를 여기 적지 않는다. 어느 저장소에 넣어도 그대로 돈다.
#  - 이미지 이름: ghcr.io/<소유자>/<저장소>-backend, -frontend  (github.repository 에서 자동. 호스트 .env 의 IMAGE_PREFIX 와 같아야 한다)
#  - 서버 정보: Settings → Secrets and variables → Actions 의 Secrets 세 개
#      DEPLOY_HOST     호스트 컴퓨터 주소 (호스트 주소)
#      DEPLOY_USER     호스트의 팀 계정 (팀 계정)
#      DEPLOY_SSH_KEY  그 계정으로 들어가는 SSH 개인 키 (공개 키는 서버 ~/.ssh/authorized_keys 에)
name: CI/CD
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ["**"]          # 모든 브랜치: test 까지. main 만 build-push 와 deploy 로 이어진다
  pull_request:
  workflow_dispatch:          # Actions 탭에서 수동 실행

jobs:
  # 1) 테스트와 빌드 검증. 어느 브랜치든 push 하면 돈다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deployment configuration checks
        run: |
          bash -n deploy/blue-green.sh deploy/setup-host.sh
          python3 scripts/test_blue_green.py
          docker compose --env-file .env.example -f compose.prod.yaml --profile blue --profile green config --quiet

      # 백엔드: JDK 21 + Gradle 캐시
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend test
        working-directory: backend
        run: ./gradlew test --no-daemon

      # 프론트엔드: Node 24 + npm 캐시
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type check and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  # 2) 이미지 빌드 → GHCR 푸시. main 에 push 됐을 때만
  build-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # GITHUB_TOKEN 으로 GHCR 에 쓸 수 있게
    strategy:
      matrix:
        service: [backend, frontend]      # 두 이미지를 병렬로
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    # 저장소마다 자동 발급. 따로 만들 것 없다

      # 태그: latest 와 sha-<커밋 7자리>. 이미지 이름은 소문자로 바꿔 준다 (GHCR 규칙)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # 3) 서버에 SSH 로 들어가 새 이미지를 받아 올린다
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    environment: production     # Actions 탭에 배포 이력이 남는다
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GHCR_USER,GHCR_TOKEN
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 블루그린 스크립트가 pull → 쉬는 색에 기동 → 헬스체크 → nginx 전환 → 이전 색 정지를 한다.
          # 헬스체크에 실패하면 전환하지 않고 종료 코드 1 로 끝나 이 job 이 빨간불이 된다. 서비스는 이전 색이 계속 받는다
          script: |
            set -e
            export DOCKER_CONFIG=$(mktemp -d /tmp/devmozip-ghcr.XXXXXX)
            trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            cd ~/DevMozip
            test "$(git branch --show-current)" = main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = '${{ github.sha }}'
            IMAGE_TAG=sha-$(printf '%s' '${{ github.sha }}' | cut -c1-7) bash deploy/blue-green.sh deploy
