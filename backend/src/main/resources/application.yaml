# compose·서버 공통 기본 설정. 비밀값은 넣지 않고 환경변수(루트 .env → compose)로 받는다.
# 로컬에서 H2로 실행할 때는 application-local.yml(커밋하지 않음)을 만들고 local 프로필로 실행한다.
# 로컬의 카카오 값은 application-local.yml에 spring.config.import: optional:file:../.env.local[.properties]를 넣어 읽는다.
spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devmozip}
    username: ${DB_USER:devmozip}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 엔티티 기준으로 테이블을 만들거나 갱신한다
      ddl-auto: update
    open-in-view: false
  # 리프레시 토큰 저장소. compose·서버는 REDIS_HOST=redis로 받는다
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  # 비밀번호 재설정 메일. 값이 없어도 서버는 뜬다. 시간 제한의 기본값은 무제한이므로 지정한다
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  web:
    error:
      include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

# 카카오 로그인. 값이 없어도 서버는 뜬다.
kakao:
  rest-api-key: ${KAKAO_REST_API:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  # DOMAINNAME/KAKAO_REDIRECT_URI가 카카오 콘솔에 등록한 Redirect URI와 정확히 같아야 한다
  domain-name: ${DOMAINNAME:}
  redirect-path: ${KAKAO_REDIRECT_URI:}

# 비밀번호 재설정. 값이 없으면 재설정 요청만 쓸 수 없고 서버는 정상 기동한다.
password-reset:
  mail-host: ${spring.mail.host:}
  mail-username: ${spring.mail.username:}
  mail-password: ${spring.mail.password:}
  from-address: ${MAIL_FROM:}
  base-url: ${DOMAINNAME:}
  token-ttl: 30m
  email-cooldown: 60s
  email-hourly-limit: 5
  ip-hourly-limit: 20

management:
  health:
    # SMTP 장애가 /actuator/health DOWN → 블루그린 배포 실패로 이어지지 않게 끈다
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

profile:
  images:
    directory: ${PROFILE_IMAGE_DIRECTORY:./uploads/profile-images}
    public-base-url: ${PROFILE_IMAGE_PUBLIC_BASE_URL:http://localhost:8080}

---
# local(H2) 프로필은 리프레시 토큰을 메모리에 두므로 Redis 없이 실행한다.
# Redis 연결 상태를 헬스체크에서 빼야 /actuator/health가 DOWN이 되지 않는다.
spring:
  config:
    activate:
      on-profile: local
management:
  health:
    redis:
      enabled: false
# DOMAINNAME이 없어도 콘솔에 출력한 재설정 링크를 그대로 쓸 수 있게 한다
password-reset:
  base-url: ${DOMAINNAME:http://localhost:3000}
