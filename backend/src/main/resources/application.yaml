spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devmozip}
    username: ${DB_USER:devmozip}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
auth:
  bootstrap:
    user-username: ${AUTH_USER_USERNAME:member@devmozip.demo}
    user-password: ${AUTH_USER_PASSWORD:}
    admin-username: ${AUTH_ADMIN_USERNAME:admin@devmozip.demo}
    admin-password: ${AUTH_ADMIN_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
