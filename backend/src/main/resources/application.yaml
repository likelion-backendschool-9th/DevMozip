# compose·서버 공통 기본 설정. 비밀값은 넣지 않고 환경변수(루트 .env → compose)로 받는다.
# 로컬에서 H2로 실행할 때는 application-local.yml(커밋하지 않음)을 만들고 local 프로필로 실행한다.
spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devmozip}
    username: ${DB_USER:devmozip}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 엔티티 기준으로 테이블을 만들거나 갱신한다
      ddl-auto: update
    open-in-view: false
  web:
    error:
      include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
